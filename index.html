<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Congratulations Winner!</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background-color: #08090d; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* Moving Stars Background */
        #starfield {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 1; pointer-events: none;
        }

        /* 3D Card Container */
        .card-perspective {
            perspective: 1000px; width: 100vw; height: 80vh;
            display: flex; justify-content: center; align-items: center; z-index: 2;
        }

        .card-inner {
            position: relative; width: 90%; height: 90%; text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d; cursor: pointer;
        }

        .card-inner.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border-radius: 16px; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .card-front {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: white; box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 2px solid rgba(255, 215, 0, 0.4); flex-direction: column;
        }

        .card-front h2 { font-size: 2rem; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .card-back { background-color: transparent; transform: rotateY(180deg); }
        .card-img { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* Typing Effect Container */
        #typed-text {
            color: #ffd700; font-size: 1.25rem; font-weight: 600; text-align: center;
            height: 15vh; line-height: 1.5; padding: 0 15px;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.5); z-index: 2;
        }

        /* Overlay with Name Input Form */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #08090d; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
            transition: opacity 0.5s ease; padding: 20px;
        }

        .input-box {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 30px; border-radius: 20px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            max-width: 400px; width: 100%;
        }

        .input-box h3 { color: #ffd700; margin-bottom: 15px; font-size: 1.4rem; }

        .name-input {
            width: 100%; padding: 12px 20px; border-radius: 25px; border: 2px solid #ff416c;
            background: #151722; color: #fff; font-size: 1rem; outline: none;
            text-align: center; margin-bottom: 20px; transition: 0.3s;
        }

        .name-input:focus { border-color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

        .open-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white;
            padding: 14px 32px; font-size: 1.1rem; font-weight: bold; border: none;
            border-radius: 50px; cursor: pointer; box-shadow: 0 10px 25px rgba(255, 65, 108, 0.5);
            transition: transform 0.2s;
        }

        .open-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <canvas id="starfield"></canvas>
    <audio id="celebrationAudio" src="celebration.mp3" preload="auto"></audio>

    <!-- Interactive Name Input Overlay -->
    <div id="overlay">
        <div class="input-box">
            <h3>✨ Welcome Winner! ✨</h3>
            <p style="color: #aaa; margin-bottom: 15px; font-size: 0.9rem;">Enter your name to open your surprise card:</p>
            <input type="text" id="userName" class="name-input" placeholder="Type Your Name..." autocomplete="off">
            <button class="open-btn" onclick="openSurprise()">Reveal Surprise 🎁</button>
        </div>
    </div>

    <!-- 3D Card -->
    <div class="card-perspective">
        <div class="card-inner" id="flipCard" onclick="manualFlip()">
            <div class="card-front">
                <h2 id="welcomeName">🎁 Special Surprise 🎁</h2>
                <p>Tap to Flip</p>
            </div>
            <div class="card-back">
                <img src="congratulation.png" alt="Congratulations Card" class="card-img">
            </div>
        </div>
    </div>
    
    <div id="typed-text"></div>

    <script>
        // --- 1. Moving Stars Effect ---
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createStars() {
            stars = [];
            const colors = ['#ffffff', '#ffd700', '#ff69b4', '#00ffff', '#ff4500'];
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                    radius: Math.random() * 2 + 1, color: colors[Math.floor(Math.random() * colors.length)],
                    speedX: (Math.random() - 0.5) * 0.8, speedY: (Math.random() - 0.5) * 0.8, alpha: Math.random()
                });
            }
        }
        createStars();

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.x += star.speedX; star.y += star.speedY;
                if (star.x < 0) star.x = canvas.width; if (star.x > canvas.width) star.x = 0;
                if (star.y < 0) star.y = canvas.height; if (star.y > canvas.height) star.y = 0;
                ctx.beginPath(); ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = star.color; ctx.globalAlpha = star.alpha; ctx.fill();
            });
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // --- 2. Confetti Effect ---
        function fireConfetti() {
            var count = 250; var defaults = { origin: { y: 0.7 } };
            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, { particleCount: Math.floor(count * particleRatio) }));
            }
            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        // --- 3. Audio Loop ---
        const audio = document.getElementById('celebrationAudio');
        function startAudioLoop() {
            if (audio) {
                audio.currentTime = 0;
                audio.play().catch(e => console.log(e));
                fireConfetti();
                setInterval(() => {
                    audio.currentTime = 0; audio.play().catch(e => console.log(e)); fireConfetti();
                }, 15000);
            }
        }

        // --- 4. Dynamic Typing Effect with User's Name ---
        let wishText = "";
        let index = 0;

        function typeWriter() {
            if (index < wishText.length) {
                document.getElementById("typed-text").innerHTML += wishText.charAt(index);
                index++;
                setTimeout(typeWriter, 50);
            }
        }

        // --- 5. Submit Name & Open Surprise ---
        function openSurprise() {
            const nameInput = document.getElementById('userName').value.trim();
            const displayName = nameInput ? nameInput : "Champion";

            wishText = `✨ Heartiest Congratulations ${displayName}! Wish you brilliant success ahead! 🏆`;
            document.getElementById('welcomeName').innerHTML = `🎁 For ${displayName} 🎁`;

            const overlay = document.getElementById('overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                document.getElementById('flipCard').classList.add('flipped');
                typeWriter();
                startAudioLoop();
            }, 500);
        }

        function manualFlip() {
            document.getElementById('flipCard').classList.toggle('flipped');
        }
    </script>
</body>
</html>
