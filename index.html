<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations Winners!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #1d1e22, #252830, #111317);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            padding: 20px;
        }
        .card-container {
            text-align: center;
            max-width: 700px;
            width: 100%;
            animation: popUp 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card-img {
            width: 100%;
            height: auto;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(255, 182, 193, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .emoji-bar {
            font-size: 2.2rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        @keyframes popUp {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="emoji-bar">🏆 🎉 🎭 ✨ 🌟</div>
        <!-- ImgBB থেকে পাওয়া Direct Link-টি src=" " এর মধ্যে বসাবে -->
        <img src="https://ibb.co/DDgP6yjz" alt="Congratulations Card" class="card-img">
    </div>

</body>
</html>
