<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations Winners!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #1d1e22, #252830, #111317);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            overflow: hidden;
            padding: 20px;
        }
        .card-container { text-align: center; max-width: 700px; width: 100%; }
        .card-img {
            width: 100%;
            height: auto;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .emoji-bar { font-size: 2.5rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="emoji-bar">🏆 🎉 🎭 ✨ 🌟</div>
        <!-- ইমেজের নামের জায়গায় আপনার আসল ফাইল নাম বসান -->
        <img src="congratulation.png" alt="Congratulations Card" class="card-img">
    </div>
</body>
</html>
